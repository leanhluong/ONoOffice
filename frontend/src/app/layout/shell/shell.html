<div class="shell" [class.shell--collapsed]="!sidebarOpen()">
  <header class="topbar">
    <button
      type="button"
      class="topbar__toggle"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-label="Đóng/mở thanh điều hướng"
    >
      ☰
    </button>

    <span class="topbar__brand">ONoOffice</span>

    <div class="topbar__spacer"></div>

    @if (store.user(); as user) {
      <div class="topbar__user">
        <span class="topbar__name">{{ user.displayName ?? user.email ?? user.userId }}</span>
        <span class="topbar__tenant" title="Tenant hiện tại">{{ user.tenantId }}</span>
      </div>
    }

    <button type="button" class="topbar__logout" (click)="logout()">Đăng xuất</button>
  </header>

  <div class="shell__body">
    <nav class="sidebar" aria-label="Điều hướng chính">
      <ul class="sidebar__list">
        @for (item of navItems; track item.path) {
          @if (item.permissions.length === 0) {
            <li>
              <a
                class="sidebar__link"
                [routerLink]="item.path"
                routerLinkActive="sidebar__link--active"
              >
                <span class="sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
                <span class="sidebar__label">{{ item.label }}</span>
              </a>
            </li>
          } @else {
            <li *appHasPermission="item.permissions">
              <a
                class="sidebar__link"
                [routerLink]="item.path"
                routerLinkActive="sidebar__link--active"
              >
                <span class="sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
                <span class="sidebar__label">{{ item.label }}</span>
              </a>
            </li>
          }
        }
      </ul>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
