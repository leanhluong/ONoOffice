<!--
  Đánh dấu chép từ `docs/07-giao-dien/org/phong-ban.html`.
  CSS nằm ở `department-tree.scss`, sinh từ chính bản dựng đó — đừng sửa tay.

  Component này GỌI CHÍNH NÓ ở cuối template. Đó là cách duy nhất dựng cây sâu tuỳ ý
  trong Angular; template không tự đệ quy được, chỉ component mới được.
-->
<div class="cay__nut" [attr.aria-expanded]="node().children.length > 0 ? open() : null">
  @if (node().children.length > 0) {
    <button
      type="button"
      class="cay__mo"
      [attr.aria-label]="(open() ? 'action.collapse' : 'action.expand') | translate"
      (click)="toggle()"
    >
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 3.5 4.5 4.5L6 12.5" />
      </svg>
    </button>
  } @else {
    <!-- Nút không có con vẫn CHỪA CHỖ của mũi tên. Bỏ hẳn thì tên của nó thụt trái hơn
         nút có con, và cả cột chữ răng cưa. -->
    <span class="cay__mo cay__mo--trong"></span>
  }

  <svg class="cay__bieu" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="14" height="14" rx="2.4" />
    <path d="M7 8.5h6M7 12h4" />
  </svg>

  <span class="cay__ten">{{ node().name }}</span>

  <!-- Số người TRỰC TIẾP của phòng này, không cộng dồn phòng con. -->
  <span class="cay__dem">{{ node().employeeCount }}</span>

  @if (node().headName) {
    <span class="cay__truong">{{ node().headName }}</span>
  }

  <span class="cay__thao">
    <button type="button" class="nuti" [attr.aria-label]="'action.rename' | translate" (click)="rename.emit(node())">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 3.5 16.5 6.5 7 16H4v-3z" />
      </svg>
    </button>
    <button type="button" class="nuti" [attr.aria-label]="'departments.move' | translate" (click)="move.emit(node())">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h9l-3-3M16 13H7l3 3" />
      </svg>
    </button>
    <button type="button" class="nuti" [attr.aria-label]="'action.delete' | translate" (click)="remove.emit(node())">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h12M8 6V4h4v2M6.5 6l.7 10h5.6l.7-10" />
      </svg>
    </button>
  </span>
</div>

@if (node().children.length > 0) {
  <div class="cay__con" [hidden]="!open()">
    @for (child of node().children; track child.id) {
      <!-- Chuyển tiếp sự kiện của nút cháu lên trên. Không có ba dòng này thì thao tác
           chỉ chạy ở cấp một, và cây càng sâu càng nhiều nút bấm không ăn. -->
      <app-department-node
        [node]="child"
        (rename)="rename.emit($event)"
        (move)="move.emit($event)"
        (remove)="remove.emit($event)"
      />
    }
  </div>
}
